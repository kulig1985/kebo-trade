# Kebo Trade - Docker Compose
#
# Indítás:   docker-compose up -d
# Logok:     docker-compose logs -f
# Leállítás: docker-compose down
#
# Több stratégia futtatása:
#   STRATEGY_ID=my_strategy_001 docker-compose up -d

services:
  trader:
    build:
      context: .
      platforms:
        - linux/amd64
    image: kebo-trade:latest
    container_name: kebo-trade-${STRATEGY_ID:-bounce_scalper_live_001}

    environment:
      - MONGODB_URI
      - STRATEGY_ID=${STRATEGY_ID:-bounce_scalper_live_001}
      - BINANCE_API_KEY
      - BINANCE_API_SECRET
      - BINANCE_TESTNET=${BINANCE_TESTNET:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    restart: unless-stopped
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: 3
