# ============================================================================
# Kebo Trade - Docker Compose (több stratégia)
# ============================================================================
#
# ELŐKÉSZÜLET:
#   1. Hozz létre env fájlokat minden stratégiához:
#      - docker-001.env
#      - docker-002.env
#
# docker-001.env tartalma:
#   MONGODB_URI=mongodb://user:pass@host:27017/nautilus?authSource=admin
#   MONGODB_ENABLED=true
#   STRATEGY_ID=bounce_scalper_001
#   BINANCE_API_KEY=your_key
#   BINANCE_API_SECRET=your_secret
#   BINANCE_TESTNET=true
#   WEBHOOK_URL=
#   LOG_LEVEL=INFO
#
# docker-002.env tartalma:
#   MONGODB_URI=mongodb://user:pass@host:27017/nautilus?authSource=admin
#   MONGODB_ENABLED=true
#   STRATEGY_ID=bounce_scalper_002    # <-- MÁS STRATEGY_ID!
#   BINANCE_API_KEY=your_key
#   BINANCE_API_SECRET=your_secret
#   BINANCE_TESTNET=true
#   WEBHOOK_URL=
#   LOG_LEVEL=INFO
#
# HASZNÁLAT:
#   docker-compose -f docker-compose.multi.yml up -d      # Indítás
#   docker-compose -f docker-compose.multi.yml logs -f    # Logok
#   docker-compose -f docker-compose.multi.yml down       # Leállítás
#
#   # Csak egy stratégia logjait:
#   docker logs -f bounce-001
#   docker logs -f bounce-002
#
# ============================================================================

services:
  bounce-001:
    image: kebo-trade:latest
    container_name: bounce-001
    env_file:
      - docker-001.env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: 3

  bounce-002:
    image: kebo-trade:latest
    container_name: bounce-002
    env_file:
      - docker-002.env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: 3
